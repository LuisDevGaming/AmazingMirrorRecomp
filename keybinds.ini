# Controller Keybinds (edited by the Kirby launcher)
# Use SDL key names. "None" leaves a button unbound.

[player1]
a       = X
b       = Z
x       = S
y       = A
l       = C
r       = V
start   = Return
select  = Right Shift
up      = Up
down    = Down
left    = Left
right   = Right
l2      = Q
r2      = E
l3      = None
r3      = None

[player2]
a       = X
b       = Z
x       = S
y       = A
l       = C
r       = V
start   = Return
select  = Right Shift
up      = Up
down    = Down
left    = Left
right   = Right
l2      = Q
r2      = E
l3      = None
r3      = None

# Controller (any SDL-supported pad). Names: a b x y back start guide
# leftshoulder rightshoulder leftstick rightstick dpup dpdown dpleft dpright
# lefttrigger righttrigger leftx- leftx+ lefty- lefty+ rightx- ... none
[pad1]
a             = a
b             = b
l             = leftshoulder
r             = rightshoulder
start         = start
select        = back
up            = dpup
down          = dpdown
left          = dpleft
right         = dpright
stick_as_dpad = 1
